<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Подключение современного шрифта с засечками -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Основные настройки */
                /* 1. Изменения в body */
        body {
            background-color: #0d0f12; 
            color: #f0f0f0;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            
            /* МЕНЯЕМ ЭТО: flex-start прижимает всё к верху (было center) */
            align-items: flex-start; 
            
            min-height: 100vh;
            margin: 0;
            
            /* МЕНЯЕМ ЭТО: делаем верхний отступ страницы 0 (было 20px) */
            padding: 0px 20px 20px 20px; 
            
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 2. Изменения в .wrapper */
        .wrapper {
            position: relative;
            
            /* МЕНЯЕМ ЭТО: уменьшаем верхний внутренний отступ до 10px (было 30px) */
            padding: 10px 30px 30px 30px; 
            
            max-width: 1000px;
            width: 100%;
        }

        /* 3. Изменения в h1.title */
        h1.title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff8d6;
            text-shadow: 0 0 10px rgba(255, 235, 150, 0.3);
            
            /* ДОБАВЛЯЕМ ЭТО: убираем стандартный верхний отступ у заголовка */
            margin-top: 0; 
            
            margin-bottom: 30px; /* Расстояние от заголовка до таблицы */
        }

        /* Контейнер для эффекта звезд */
        .wrapper {
            position: relative;
            padding: 30px;
            max-width: 1000px;
            width: 100%;
        }

        /* Заголовок */
        h1.title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff8d6;
            text-shadow: 0 0 10px rgba(255, 235, 150, 0.3);
            margin-bottom: 40px;
        }

        /* Таблица */
        .firefly-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 20px; /* Расстояние между ячейками */
            background: transparent;
            position: relative;
            z-index: 2;
        }

        /* Ячейки */
        .firefly-cell {
            background: rgba(255, 255, 255, 0.02); /* Почти прозрачный */
            border: 1px solid rgba(255, 243, 168, 0.3); /* Светло-желтая рамка */
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            vertical-align: top;
            width: 33.33%;
            box-sizing: border-box;
            /* Мягкое подсвечивание рамок */
            box-shadow: 0 0 12px rgba(255, 235, 150, 0.08),
                 inset 0 0 12px rgba(255, 235, 150, 0.05);
            backdrop-filter: blur(3px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Легкое усиление свечения при наведении */
        .firefly-cell:hover {
            border-color: rgba(255, 243, 168, 0.6);
            box-shadow: 0 0 18px rgba(255, 235, 150, 0.2),
                 inset 0 0 15px rgba(255, 235, 150, 0.1);
        }

        /* Изображение светлячка */
        .firefly-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin: 0 auto 15px auto;
            display: block;
            filter: drop-shadow(0 0 8px rgba(255, 235, 150, 0.3));
        }

        /* Имя владельца */
        .owner-name {
            font-size: 0.95rem;
            color: #b5b5b5;
            margin-bottom: 4px;
            font-weight: 400;
        }

        /* Имя светлячка (наиболее выделено) */
        .firefly-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff8d6;
            text-shadow: 0 0 8px rgba(255, 235, 150, 0.4);
            margin-bottom: 2px;
            line-height: 1.2;
        }

        /* Вид светлячка (более мелко) */
        .firefly-species {
            font-size: 0.85rem;
            font-style: italic;
            color: #999;
            margin-bottom: 20px;
        }

        /* Контейнер шкалы прогресса (Медовый стиль) */
        .progress-container {
            width: 85%;
            height: 10px;
            background: rgba(40, 30, 10, 0.6);
            border: 1px solid rgba(212, 160, 23, 0.4);
            border-radius: 10px;
            margin: 0 auto 8px auto;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        /* Заполняемая часть шкалы */
        .progress-bar {
            height: 100%;
            /* Ширина вычисляется через CSS-переменную --pts (макс 500) */
            width: calc((var(--pts) / 500) * 100%); 
            background: linear-gradient(90deg, #d48806, #ffec3d, #ffa940);
            background-size: 200% 100%;
            border-radius: 10px;
            /* Сияние медовой шкалы */
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 3px rgba(255, 255, 255, 0.8);
            /* Анимация перелива/поблескивания */
            animation: honeyGlow 3s infinite linear;
        }

        @keyframes honeyGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Неброская надпись с количеством баллов */
        .points-text {
            font-size: 0.8rem;
            color: #7a7a7a;
            letter-spacing: 0.5px;
        }

        /* Вспомогательный класс для отображения текущих баллов */
        .points-text span {
            color: #aaaaaa;
        }

        /* --- Стили для редких летающих звездочек --- */
        .star {
            position: absolute;
            background: #fff8d6;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 0 6px #ffe875;
            animation: floatAndTwinkle var(--duration) infinite ease-in-out;
            animation-delay: var(--delay);
            z-index: 1;
        }

        @keyframes floatAndTwinkle {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.8);
            }
            50% {
                opacity: var(--max-opacity);
                transform: translateY(-20px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px) scale(0.8);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="particles-container">
        
        <h1 class="title">Сейчас приручаются:</h1>

        <table class="firefly-table">
            <tr>
                <!-- ================= ЯЧЕЙКА 1 ================= -->
                <td class="firefly-cell">
                    <!-- Ссылка на картинку -->
                    <img class="firefly-img" src="https://psv4.vkuserphoto.ru/s/v1/d2/CTRYP8f4w0NI3N1Ctf2LKLLSVQ41O6YdGfbDtvYfP5-2p7yAWD0exIR5S7WTgm3pZdfNdj84jDH436Q_gq-vw0n6xgjJkweYftc2u-cNGIflDYjQqFVU445Fpt7-GL8oSRuMGZV6lVEG/0_Svetlyachok.png" alt="Светлячок">
                    
                    <!-- Имя владельца -->
                    <div class="owner-name">Владелец: ?</div>
                    
                    <!-- Имя светлячка -->
                    <div class="firefly-name">Имя светлячка</div>
                    
                    <!-- Вид светлячка -->
                    <div class="firefly-species">Вид счетлячка</div>
                    
                    <!-- Шкала прогресса: Укажите количество баллов в --pts: ХX; (макс. 500) -->
                    <div class="progress-container">
                        <div class="progress-bar" style="--pts: 0;"></div>
                    </div>
                    
                    <!-- Надпись под шкалой -->
                    <div class="points-text"><span>0</span> / 500 баллов</div>
                </td>

                <!-- ================= ЯЧЕЙКА 2 ================= -->
                 <td class="firefly-cell">
                    <!-- Ссылка на картинку -->
                    <img class="firefly-img" src="https://psv4.vkuserphoto.ru/s/v1/d2/CTRYP8f4w0NI3N1Ctf2LKLLSVQ41O6YdGfbDtvYfP5-2p7yAWD0exIR5S7WTgm3pZdfNdj84jDH436Q_gq-vw0n6xgjJkweYftc2u-cNGIflDYjQqFVU445Fpt7-GL8oSRuMGZV6lVEG/0_Svetlyachok.png" alt="Светлячок">
                    
                    <!-- Имя владельца -->
                    <div class="owner-name">Владелец: ?</div>
                    
                    <!-- Имя светлячка -->
                    <div class="firefly-name">Имя светлячка</div>
                    
                    <!-- Вид светлячка -->
                    <div class="firefly-species">Вид счетлячка</div>
                    
                    <!-- Шкала прогресса: Укажите количество баллов в --pts: ХX; (макс. 500) -->
                    <div class="progress-container">
                        <div class="progress-bar" style="--pts: 0;"></div>
                    </div>
                    
                    <!-- Надпись под шкалой -->
                    <div class="points-text"><span>0</span> / 500 баллов</div>
                </td>

                <!-- ================= ЯЧЕЙКА 3 ================= -->
                 <td class="firefly-cell">
                    <!-- Ссылка на картинку -->
                    <img class="firefly-img" src="https://psv4.vkuserphoto.ru/s/v1/d2/CTRYP8f4w0NI3N1Ctf2LKLLSVQ41O6YdGfbDtvYfP5-2p7yAWD0exIR5S7WTgm3pZdfNdj84jDH436Q_gq-vw0n6xgjJkweYftc2u-cNGIflDYjQqFVU445Fpt7-GL8oSRuMGZV6lVEG/0_Svetlyachok.png" alt="Светлячок">
                    
                    <!-- Имя владельца -->
                    <div class="owner-name">Владелец: ?</div>
                    
                    <!-- Имя светлячка -->
                    <div class="firefly-name">Имя светлячка</div>
                    
                    <!-- Вид светлячка -->
                    <div class="firefly-species">Вид счетлячка</div>
                    
                    <!-- Шкала прогресса: Укажите количество баллов в --pts: ХX; (макс. 500) -->
                    <div class="progress-container">
                        <div class="progress-bar" style="--pts: 0;"></div>
                    </div>
                    
                    <!-- Надпись под шкалой -->
                    <div class="points-text"><span>0</span> / 500 баллов</div>
                </td>
            </tr>
            <!-- Чтобы добавить еще одну строчку из 3-х светлячков, просто скопируйте блок <tr>...</tr> ниже -->
        </table>

    </div>

    <!-- Скрипт для создания редких неярких звездочек сияния -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('particles-container');
            const particleCount = 20; // Количество звездочек (редкие)

            for (let i = 0; i < particleCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Случайные размеры и позиции
                const size = Math.random() * 3 + 1; // от 1px до 4px
                const posX = Math.random() * 100; // % от ширины
                const posY = Math.random() * 100; // % от высоты
                
                // Случайные параметры анимации
                const duration = Math.random() * 4 + 4; // 4s - 8s (медленно)
                const delay = Math.random() * 5; // задержка старта
                const maxOpacity = Math.random() * 0.5 + 0.2; // Неяркие (0.2 - 0.7)

                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${posX}%`;
                star.style.top = `${posY}%`;
                
                // Передаем переменные в CSS
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--delay', `${delay}s`);
                star.style.setProperty('--max-opacity', maxOpacity);

                container.appendChild(star);
            }
        });
    </script>
</body>
</html>
